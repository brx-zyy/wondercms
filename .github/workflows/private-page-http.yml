name: Temporary private-page authorization HTTP test

on:
  push:
    branches:
      - audit/live-notification-http-20261123

permissions:
  contents: read

jobs:
  private-page-http:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: curl, mbstring, zip, fileinfo, dom
          coverage: none
      - name: Boot isolated WonderCMS and probe anonymous routes
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/wcms-private
          mkdir -p /tmp/wcms-private
          cp index.php .htaccess /tmp/wcms-private/
          cp -r themes /tmp/wcms-private/
          cd /tmp/wcms-private
          php -d display_errors=1 -d error_reporting=-1 -S 127.0.0.1:8099 >/tmp/wcms-private-server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sSf http://127.0.0.1:8099/ -o /tmp/boot.html; then break; fi
            sleep 1
          done
          grep -q '<html' /tmp/boot.html

          # Install deterministic private parent + child and a public control page.
          php -r '
            $p="data/database.js"; $db=json_decode(file_get_contents($p));
            if (!$db || !isset($db->pages)) {fwrite(STDERR,"database structure missing\\n");exit(1);}
            $db->pages->private=(object)[
              "title"=>"Private parent","keywords"=>"","description"=>"",
              "content"=>"PRIVATE_PARENT_SECRET_7f31",
              "private"=>true,
              "subpages"=>(object)[
                "child"=>(object)[
                  "title"=>"Private child","keywords"=>"","description"=>"",
                  "content"=>"PRIVATE_CHILD_SECRET_9a42"
                ]
              ]
            ];
            $db->pages->public=(object)[
              "title"=>"Public control","keywords"=>"","description"=>"",
              "content"=>"PUBLIC_CONTROL_123"
            ];
            file_put_contents($p,json_encode($db,JSON_PRETTY_PRINT|JSON_UNESCAPED_UNICODE));
          '

          probe() {
            label="$1"; path="$2"; expected="$3"
            curl --path-as-is -sS -D "/tmp/$label.headers" "http://127.0.0.1:8099/$path" -o "/tmp/$label.body"
            if grep -Eq 'PRIVATE_(PARENT|CHILD)_SECRET_' "/tmp/$label.body"; then
              echo "FAIL: anonymous route leaked private content: $label ($path)"
              exit 1
            fi
            if [ "$expected" = "public" ] && ! grep -q 'PUBLIC_CONTROL_123' "/tmp/$label.body"; then
              echo "FAIL: public control page did not render: $label"
              exit 1
            fi
            echo "PASS: $label did not expose private page content"
          }

          probe private_root 'index.php?page=private' private
          probe private_child 'index.php?page=private%2Fchild' private
          probe private_child_nested 'index.php?page=private/child' private
          probe private_child_double_slash 'index.php?page=private//child' private
          probe private_child_double_encoded 'index.php?page=private%252Fchild' private
          probe private_child_backslash 'index.php?page=private%5Cchild' private
          probe public_control 'index.php?page=public' public

          if grep -qiE 'Warning:|Deprecated:|Notice:|Fatal error' /tmp/wcms-private-server.log; then
            cat /tmp/wcms-private-server.log
            exit 1
          fi
          echo "PASS: all anonymous private-page route probes blocked; public control rendered."
