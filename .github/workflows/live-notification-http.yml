name: Temporary live HTTP notification test

on:
  push:
    branches:
      - audit/live-notification-http-20261123

permissions:
  contents: read

jobs:
  notification-http:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: curl, mbstring, zip, fileinfo, dom
          coverage: none
      - name: Start an isolated WonderCMS HTTP instance
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/wcms-live
          mkdir -p /tmp/wcms-live
          cp index.php .htaccess /tmp/wcms-live/
          cp -r themes /tmp/wcms-live/
          cd /tmp/wcms-live
          php -d display_errors=1 -d error_reporting=-1 -S 127.0.0.1:8099 >/tmp/wcms-live-server.log 2>&1 &
          echo $! >/tmp/wcms-live-server.pid
          for i in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:8099/ >/tmp/wcms-first.html; then break; fi
            sleep 1
          done
          grep -q '<html' /tmp/wcms-first.html
          PW=$(grep -oE 'everything is: <b>[^<]+' /tmp/wcms-first.html | sed 's/.*<b>//')
          test -n "$PW"
          echo "Fresh install HTTP booted; generated initial admin password."

          # Create a private parent page so the admin notification path is exercised.
          php -r '
            $path = "data/database.js";
            $db = json_decode(file_get_contents($path));
            if (!$db || !isset($db->pages)) { fwrite(STDERR, "database structure missing\\n"); exit(1); }
            $db->pages->private = (object) [
              "title" => "Private",
              "keywords" => "",
              "description" => "",
              "content" => "private test content",
              "private" => true
            ];
            file_put_contents($path, json_encode($db, JSON_PRETTY_PRINT | JSON_UNESCAPED_UNICODE));
          '

          # Authenticate through the actual HTTP login route, retaining the session cookie.
          curl --silent --show-error --fail -c /tmp/wcms-cookie -b /tmp/wcms-cookie \
            -X POST --data-urlencode "password=$PW" \
            'http://127.0.0.1:8099/?page=loginURL' -o /tmp/wcms-login.html
          curl --silent --show-error --fail -c /tmp/wcms-cookie -b /tmp/wcms-cookie \
            'http://127.0.0.1:8099/' -o /tmp/wcms-admin.html
          grep -q 'settingsModal' /tmp/wcms-admin.html

          # Request a missing child beneath a private parent, with an XSS-shaped path segment.
          curl --silent --show-error --fail -c /tmp/wcms-cookie -b /tmp/wcms-cookie \
            'http://127.0.0.1:8099/?page=private/%3Cscript%3Ealert(1)%3C%2Fscript%3E' \
            -o /tmp/wcms-notification.html

          # The private-page alert must be present, but the attacker-controlled segment must remain text.
          grep -Fq 'This page (' /tmp/wcms-notification.html
          grep -Fq '&lt;script&gt;alert(1)&lt;/script&gt;' /tmp/wcms-notification.html
          php -r '
            $html = file_get_contents("/tmp/wcms-notification.html");
            libxml_use_internal_errors(true);
            $dom = new DOMDocument();
            if (!$dom->loadHTML($html)) { fwrite(STDERR, "could not parse HTTP response HTML\\n"); exit(1); }
            $xpath = new DOMXPath($dom);
            if ($xpath->query("//script[contains(., \"alert(1)\")]")->length !== 0) {
              fwrite(STDERR, "injected script element detected\\n"); exit(1);
            }
            if ($xpath->query("//img[@src=\"x\"]")->length !== 0) {
              fwrite(STDERR, "injected image element detected\\n"); exit(1);
            }
            echo "PASS: HTTP admin notification rendered payload as escaped text; no injected script/img element.\\n";
          '
          echo "HTTP notification response checked successfully."
          if grep -qiE 'Warning:|Deprecated:|Notice:|Fatal error' /tmp/wcms-live-server.log; then
            cat /tmp/wcms-live-server.log
            exit 1
          fi
